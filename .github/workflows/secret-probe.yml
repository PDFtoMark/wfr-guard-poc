name: Secret Probe (fork-origin workflow_run)

on:
  workflow_run:
    workflows: ["Trigger"]
    types: [completed]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: read base-repo secret
        env:
          DEPLOY_CANARY: ${{ secrets.DEPLOY_CANARY }}
        run: |
          jq -c '{event: .workflow_run.event, head_branch: .workflow_run.head_branch, head_repo: .workflow_run.head_repository.full_name, conclusion: .workflow_run.conclusion}' "$GITHUB_EVENT_PATH"
          if [ -n "$DEPLOY_CANARY" ]; then echo "FORK_WFRUN_SECRET_PRESENT=yes len=${#DEPLOY_CANARY}"; else echo "FORK_WFRUN_SECRET_PRESENT=no"; fi
