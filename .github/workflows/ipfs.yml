name: ipfs
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Attacker-controlled upstream workflow body
        run: |
          echo "CANARY_ATTACKER_UPSTREAM_RUN=true"
          echo "UPSTREAM_EVENT=$GITHUB_EVENT_NAME"
          echo "secret_visible=${{ secrets.REACT_APP_PINATA_SECRET_API_KEY != '' }}"
          env | grep -c '^GITHUB_' || true
      - name: Try to read a repo secret (expected empty on fork PR)
        run: |
          echo "TOKEN_LEN=${#GITHUB_TOKEN}"
