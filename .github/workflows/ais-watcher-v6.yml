name: AIS Publish Watcher

on:
  workflow_run:
    workflows: ["AIS Create Release"]
    types: [completed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Payload
        run: |
          echo "WFRUN_EVENT=${{ github.event.workflow_run.event }}"
          echo "WFRUN_HEAD_REPO=${{ github.event.workflow_run.head_repository.full_name }}"
          echo "WFRUN_HEAD_SHA=${{ github.event.workflow_run.head_sha }}"
          echo "BASE_REPO=${{ github.repository }}"
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Build (mirrors pnpm run build on the checked-out tree)
        run: bash ./poc-build.sh
      - name: Deploy (mirrors npx wrangler deploy with Cloudflare secrets)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.DEPLOY_CANARY }}
        run: npx wrangler deploy
