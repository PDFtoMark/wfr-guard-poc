name: Fix Probe FC

on:
  workflow_run:
    workflows:
      - "Apply-FC"
    types:
      - completed

defaults:
  run:
    shell: bash

jobs:
  prepare:
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Context
        env:
          SECRET_CANARY: ${{ secrets.DEPLOY_CANARY }}
        run: |
          echo "EVENT=$GITHUB_EVENT_NAME"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "CHECKOUT_HEAD=$(git rev-parse HEAD)"
          echo "HAS_PR_KEY=$(jq -r 'has("pull_request")' "$GITHUB_EVENT_PATH")"
          echo "HAS_PR_NUM=$(jq -r '.pull_request.number // "absent"' "$GITHUB_EVENT_PATH")"
          echo "WFR_EVENT=$(jq -r '.workflow_run.event' "$GITHUB_EVENT_PATH")"
          echo "WFR_HEAD_SHA=$(jq -r '.workflow_run.head_sha' "$GITHUB_EVENT_PATH")"
          echo "SECRET_PRESENT=$([ -n "$SECRET_CANARY" ] && echo yes || echo no)"
          if [ -f MARKER_FC.txt ]; then echo "PR_MARKER_PRESENT=true"; else echo "PR_MARKER_PRESENT=false"; fi
      - name: Check last commit (filecoin fix.yml line)
        id: skip-fix
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "RESOLVED_SHA=${SHA}"
          if [[ "$(git log --format=%B -n 1 "${SHA}" | head -n 1)" == *"[skip fix]" ]]; then
            echo "this=true" >> $GITHUB_OUTPUT
          else
            echo "this=false" >> $GITHUB_OUTPUT
          fi
          echo "SKIP_FIX=$([ "$(cat $GITHUB_OUTPUT | tail -1 | cut -d= -f2)" = true ] && echo true || echo false)"
