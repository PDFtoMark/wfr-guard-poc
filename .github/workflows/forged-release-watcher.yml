name: Forged Release Watcher
on:
  workflow_run:
    workflows: ["Release Workflow"]
    types: [completed]
permissions:
  contents: read
jobs:
  aurlike:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: ctx
        run: jq -c '{event:.workflow_run.event, name:.workflow_run.name, head_branch:.workflow_run.head_branch, head_repo:.workflow_run.head_repository.full_name, fork:.workflow_run.head_repository.fork, conclusion:.workflow_run.conclusion}' "$GITHUB_EVENT_PATH"
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
      - name: Extract version
        run: |
          TAG="${{ github.event.workflow_run.head_branch }}"
          echo "PKGVER_LIKE=${TAG#v}"
          echo "SECRET_PRESENT=$([ -n "$DEPLOY_CANARY" ] && echo yes || echo no)"
        env:
          DEPLOY_CANARY: ${{ secrets.DEPLOY_CANARY }}
