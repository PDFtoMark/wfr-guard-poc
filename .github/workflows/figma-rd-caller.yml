name: Figma RD Caller
on:
  workflow_run:
    workflows: ['Figma Forge Upstream']
    types: [completed]
permissions:
  id-token: write
  issues: write
jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/figma-rd-callee.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha }}
