name: Trino Upload PoC

on:
  workflow_run:
    workflows: ["Trigger"]
    types:
      - completed

permissions:
  actions: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  upload-to-s3:
    if: github.secret_source != 'None' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Diagnostics
        run: |
          echo "SECRET_SOURCE=[${{ github.secret_source }}]"
          echo "TRIGGER_EVENT=${{ github.event.workflow_run.event }}"
          echo "HEAD_REPO=${{ github.event.workflow_run.head_repository.full_name }}"
          echo "HEAD_BRANCH=${{ github.event.workflow_run.head_branch }}"
          echo "AWS_SECRET_PRESENT=${#AWS_SECRET_ACCESS_KEY}"
        env:
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TEST_RESULTS_AWS_SECRET_ACCESS_KEY }}
      - name: 'Download artifact'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const opts = github.rest.actions.listWorkflowRunArtifacts.endpoint.merge({
               owner: context.repo.owner,
               repo: context.repo.repo,
               run_id: ${{github.event.workflow_run.id }},
            });
            const artifacts = await github.paginate(opts);
            for (const artifact of artifacts) {
              if (!artifact.name.startsWith('test report ')) {
                continue;
              }
              const download = await github.rest.actions.downloadArtifact({
                 owner: context.repo.owner,
                 repo: context.repo.repo,
                 artifact_id: artifact.id,
                 archive_format: 'zip',
              });
              fs.writeFileSync('${{github.workspace}}/' + artifact.name + '.zip', Buffer.from(download.data));
            }
      - run: |
          for archive in *.zip; do
            # $archive is literally *.zip if there are no zip files matching the glob expression
            [ -f "$archive" ] || continue
            name=$(basename "$archive" .zip)
            mkdir "$name"
            (cd "$name" && unzip ../"$archive")
          done
      - name: Trino Upload PoC to S3
        env:
          S3_BUCKET: ${{ vars.TEST_RESULTS_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ vars.TEST_RESULTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TEST_RESULTS_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-2
          BRANCH_NAME: ${{ github.event.workflow_run.head_branch }}
          GIT_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_NAME: ${{ github.event.workflow.name }}
        if: env.S3_BUCKET != '' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          # Don't prefix attributes, because +@ (the default prefix) is not a valid character in nested row field names in the Hive connector for JSON files.
          yq_opts=(
              --input-format=xml
              --output-format=json
              --xml-attribute-prefix=''
              --xml-content-name='content'
              --xml-skip-directives
              --xml-skip-proc-inst
          )

          surefire_selector='.testsuite.testcase |= ([] + .) | .testsuite.testcase[] |= del(.system-err, .system-out) | .testsuite |= del(.properties) | .. |= select(tag == "!!str") |= sub("(.{0,1000}).*", "${1}")'

          testng_selector='.. |= select(tag == "!!map") |= with_entries(.key |= sub("-", "_")) | .suite.group.method |= ([] + .) | .suite.test.class[].test_method |= ([] + .) | .suite.test.class[].test_method[].params |= ([] + .) | .. |= select(tag == "!!str") |= sub("(.{0,1000}).*", "${1}")'

          artifact_id='${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}.json.gz'

          find . \
            -name TEST-\*.xml \
            -exec yq "${yq_opts[@]}" "$surefire_selector" {} \; \
                | jq -c > surefire.ndjson
          find . \
            -name testng-results.xml \
            -exec yq "${yq_opts[@]}" "$testng_selector" {} \; \
                | jq -c > testng.ndjson

          for filename in *.ndjson; do
            if [ ! -s "$filename" ]; then
              continue;
            fi
            jq -c \
              --argjson addObj '{"branch":"","git_sha":"","workflow_name":"","workflow_run":"${{ github.event.workflow_run.id }}","workflow_conclusion":"${{ github.event.workflow_run.conclusion }}","workflow_job":"","workflow_run_attempt":"${{ github.event.workflow_run.run_attempt }}","timestamp":""}' \
              --arg timestamp "$(date -u '+%F %T.%3NZ')" \
              --arg branch "$BRANCH_NAME" \
              --arg git_sha "$GIT_SHA" \
              --arg workflow_name "$WORKFLOW_NAME" \
              '. + $addObj | .branch=$branch | .git_sha=$git_sha | .workflow_name=$workflow_name | .timestamp=$timestamp' "$filename" | gzip -c > "$artifact_id"

            # PoC sink: the real workflow runs
            #   aws s3 cp --no-progress "$artifact_id" "s3://$S3_BUCKET/tests/results/type=$(basename "$filename" .ndjson)/repo=$(basename "${{ github.repository }}")/date_created=$(date -u '+%Y-%m-%d')/$artifact_id"
            # Here we only record what would have been uploaded, because no real bucket exists.
            mkdir -p sink
            cp "$artifact_id" "sink/type=$(basename "$filename" .ndjson)-$artifact_id"
            echo "=== WOULD_UPLOAD s3://$S3_BUCKET/tests/results/type=$(basename "$filename" .ndjson)/repo=$(basename "${{ github.repository }}")/date_created=$(date -u '+%Y-%m-%d')/$artifact_id"
            zcat "sink/type=$(basename "$filename" .ndjson)-$artifact_id"
          done
