name: AIS Guard (exact head-repo gate)

on:
  workflow_run:
    workflows: ["AIS PR Helper"]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-latest
    steps:
      - name: Privileged publish path reached
        run: |
          echo "GATE_PASSED"
          echo "head_repo=${{ github.event.workflow_run.head_repository.full_name }}"
          echo "base=${{ github.repository }}"
