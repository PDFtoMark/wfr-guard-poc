name: Gab ForkPR WFR Probe
on:
  workflow_run:
    workflows: ["Trigger"]
    types: [completed]
permissions:
  contents: read
jobs:
  guarded:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.fork == true &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: privileged body
        run: |
          echo "FORK_PR_GATE_PASSED=true"
          echo "head_branch=${{ github.event.workflow_run.head_branch }}"
          echo "head_repo=${{ github.event.workflow_run.head_repository.full_name }}"
          echo "trigger_event=${{ github.event.workflow_run.event }}"
