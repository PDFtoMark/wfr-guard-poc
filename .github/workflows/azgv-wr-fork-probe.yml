name: azgv-wr-fork-probe

on:
  workflow_run:
    workflows: ["Trigger"]
    types: [completed]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: ctx
        run: |
          jq -c '{event:.workflow_run.event,head_branch:.workflow_run.head_branch,head_sha:.workflow_run.head_sha,head_repo:.workflow_run.head_repository.full_name,fork:.workflow_run.head_repository.fork,conclusion:.workflow_run.conclusion}' "$GITHUB_EVENT_PATH"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: inspect
        run: |
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "HEAD=$(git rev-parse HEAD)"
          if [ -f fork-marker-xyz.txt ]; then echo "FORK_MARKER_PRESENT=true"; else echo "FORK_MARKER_PRESENT=false"; fi
