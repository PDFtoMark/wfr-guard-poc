name: SQ Guard Exact
# Replicates nextcloud/passman .github/workflows/sonarqube.yml job gate exactly.
on:
  workflow_run:
    workflows: ["Trigger"]
    types: [completed]
permissions:
  actions: read
  contents: read
  pull-requests: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: dump workflow_run context
        run: |
          jq -c '{event:.workflow_run.event,conclusion:.workflow_run.conclusion,prs:.workflow_run.pull_requests,head_repo:.workflow_run.head_repository.full_name,head_sha:.workflow_run.head_sha,head_branch:.workflow_run.head_branch}' "$GITHUB_EVENT_PATH"
  sonarqube_like:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0]
    runs-on: ubuntu-latest
    steps:
      - name: CANARY
        env:
          CANARY: ${{ secrets.DEPLOY_CANARY }}
        run: |
          echo "SQ_GUARD_PASSED=true"
          echo "CANARY_SECRET_PRESENT=$([ -n "$CANARY" ] && echo yes || echo no)"
