name: azgv-guard-probe

on:
  workflow_dispatch:

jobs:
  pure-expr-match:
    if: ${{ github.repository != 'PDFtoMark/wfr-guard-poc' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "PURE-EXPR-MATCH-RAN"

  bare-match:
    if: github.repository != 'PDFtoMark/wfr-guard-poc'
    runs-on: ubuntu-latest
    steps:
      - run: echo "BARE-MATCH-RAN"

  mixed-true-and-false:
    if: (true) && ${{ github.repository != 'PDFtoMark/wfr-guard-poc' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "MIXED-TRUE-AND-FALSE-RAN"

  mixed-expr-false:
    if: ${{ true }} && ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "MIXED-EXPR-FALSE-RAN"

  mixed-exact-match:
    if: (${{ github.event.workflow_run.conclusion == 'success' }} || ${{github.event_name == 'workflow_dispatch'}} || ${{github.event_name == 'schedule'}}) && ${{ github.repository != 'PDFtoMark/wfr-guard-poc' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "MIXED-EXACT-MATCH-RAN"

  mixed-exact-nomatch:
    if: (${{ github.event.workflow_run.conclusion == 'success' }} || ${{github.event_name == 'workflow_dispatch'}} || ${{github.event_name == 'schedule'}}) && ${{ github.repository != 'Azure/Azure-Governance-Visualizer-Accelerator' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "MIXED-EXACT-NOMATCH-RAN"
