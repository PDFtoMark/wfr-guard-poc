name: Trigger

on:
  push:
  pull_request:
  pull_request_target:
  issues:
  issue_comment:
  fork:
  watch:
  gollum:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
      - name: Report context
        run: |
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
          echo "ACTOR=$GITHUB_ACTOR"
      - name: Attacker-controlled test report artifact
        run: |
          mkdir -p out
          cat > out/TEST-evil.xml <<'XML'
          <testsuite name="attacker" tests="1" failures="0">
            <testcase name="FORK-PR-INJECTED-ROW" classname="io.trino.Fake" time="0.001"/>
          </testsuite>
          XML
      - uses: actions/upload-artifact@v7
        with:
          name: test report forkpr
          path: out/TEST-*.xml
