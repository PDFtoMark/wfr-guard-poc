name: azgv-guard-exact

on:
  workflow_dispatch:

jobs:
  repo-matches-guard:
    if: (${{ github.event.workflow_run.conclusion == 'success' }} || ${{github.event_name == 'workflow_dispatch'}} || ${{github.event_name == 'schedule'}}) && ${{ github.repository != 'PDFtoMark/wfr-guard-poc' }}
    runs-on: ubuntu-latest
    steps:
      - name: should-not-run
        run: echo "MATCH-BRANCH-RAN-UNEXPECTEDLY"

  repo-differs-guard:
    if: (${{ github.event.workflow_run.conclusion == 'success' }} || ${{github.event_name == 'workflow_dispatch'}} || ${{github.event_name == 'schedule'}}) && ${{ github.repository != 'Azure/Azure-Governance-Visualizer-Accelerator' }}
    runs-on: ubuntu-latest
    steps:
      - name: should-run
        run: echo "NOMATCH-BRANCH-RAN-AS-EXPECTED repo=${{ github.repository }}"
