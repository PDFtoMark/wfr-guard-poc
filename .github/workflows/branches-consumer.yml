name: Branches Consumer
on:
  workflow_run:
    workflows: ["Trigger"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
      - name: check whether head_branch resolves to fork content
        run: |
          echo "head_branch=${{ github.event.workflow_run.head_branch }}"
          echo "head_repo=${{ github.event.workflow_run.head_repository.full_name }}"
          echo "checked_out=$(git rev-parse HEAD)"
          if [ -f .github/workflows/forged-producer.yml ]; then echo "CHECKOUT_ATTACKER_CODE=true"; else echo "CHECKOUT_ATTACKER_CODE=false"; fi
