name: Forge Consumer
on:
  workflow_run:
    workflows: ["Forged Name"]
    types: [completed]
    branches: [probe-forge]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "FORGE_CONSUMER_RAN=true"
          echo "head_branch=${{ github.event.workflow_run.head_branch }}"
          echo "event=${{ github.event.workflow_run.event }}"
          echo "head_repo=${{ github.event.workflow_run.head_repository.full_name }}"
          echo "name=${{ github.event.workflow_run.name }}"
