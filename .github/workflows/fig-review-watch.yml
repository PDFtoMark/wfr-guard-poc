name: Fig Review Watch
on:
  workflow_run:
    workflows: ['Fig Review Upstream']
    types: [completed]
permissions:
  id-token: write
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: ctx
        run: jq -c '{event:.workflow_run.event,head_sha:.workflow_run.head_sha,head_branch:.workflow_run.head_branch,head_repo:.workflow_run.head_repository.full_name,head_repo_id:.workflow_run.head_repository.id,repo:.repository.full_name,repo_id:.repository.id,head_commit:.workflow_run.head_commit.id,pull_requests:.workflow_run.pull_requests}' "$GITHUB_EVENT_PATH"
      - name: checkout-pr-merge-sha
        id: co
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: inspect
        run: |
          echo "CHECKOUT_OUTCOME=${{ steps.co.outcome }}"
          if [ -f PWNED_FIGMA ]; then echo "ATTACKER_CODE_EXECUTED=true"; cat PWNED_FIGMA; else echo "ATTACKER_CODE_EXECUTED=false"; fi
          echo "IDTOKEN_LEN=${#ACTIONS_ID_TOKEN_REQUEST_TOKEN}"
