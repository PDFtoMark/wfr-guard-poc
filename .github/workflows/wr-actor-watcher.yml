name: wr-actor-watcher
on:
  workflow_run:
    workflows: ["forge-me2"]
    types: [completed]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: dump context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "GITHUB_ACTOR=$GITHUB_ACTOR"
          echo "TRIGGERING_ACTOR=${{ github.triggering_actor }}"
          jq -c '{event: .workflow_run.event, name: .workflow_run.name, conclusion: .workflow_run.conclusion, head_branch: .workflow_run.head_branch, head_repository: .workflow_run.head_repository.full_name, wr_actor: .workflow_run.actor.login, wr_triggering_actor: .workflow_run.triggering_actor.login, sender: .sender.login, prs: .workflow_run.pull_requests}' "$GITHUB_EVENT_PATH"
          echo "--- permission of github.actor ---"
          gh api "repos/${{ github.repository }}/collaborators/${GITHUB_ACTOR}/permission" --jq '.permission' || echo "NONE"
